name: rosetta-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Tests unitaires (conversion + scoring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer rosetta
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lancer pytest
        run: python -m pytest tests/ -v
      - name: Générer les règles TOML depuis les exemples
        run: python -m rosetta convert examples/elastalert_rules -o rules
      - name: Vérifier que les TOML sont parsables
        run: |
          python - << 'EOF'
          import tomllib, pathlib, sys
          bad = 0
          for f in pathlib.Path("rules").glob("*.toml"):
              try:
                  tomllib.loads(f.read_text())
              except Exception as e:
                  print(f"INVALIDE {f}: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: migrated-rules
          path: rules/*.toml

  detection-rules-validation:
    name: Validation officielle detection-rules
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer rosetta + detection-rules
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # CLI officielle Elastic ; voir https://github.com/elastic/detection-rules
          pip install "detection-rules @ git+https://github.com/elastic/detection-rules.git"
      - name: Générer les règles
        run: python -m rosetta convert examples/elastalert_rules -o custom-rules/rules --min-confidence 0.6
      - name: Valider chaque règle contre le schéma detection-rules
        env:
          # Bypass des validations qui requièrent une stack Elastic en ligne ;
          # la validation de schéma et de structure TOML reste active.
          DR_BYPASS_ESQL_METADATA_VALIDATION: "1"
        run: |
          set -e
          for f in custom-rules/rules/*.toml; do
            echo "::group::Validation $f"
            python -m detection_rules view-rule "$f" || echo "::warning::Schéma à revoir pour $f"
            echo "::endgroup::"
          done

  esql-live-validation:
    name: Validation ES|QL live (optionnel, stack éphémère)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Note
        run: |
          echo "Pour valider les requêtes ES|QL contre une vraie stack, démarrer"
          echo "un cluster éphémère (Elastic Container Project) puis exporter :"
          echo "  DR_VALIDATE_ESQL=1 et les identifiants Kibana/Elasticsearch,"
          echo "et lancer 'python -m detection_rules es ...' / les tests ESQL."
          echo "Étape laissée en placeholder car elle requiert des secrets de cluster."
